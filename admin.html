<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel admin | Kurowska Pracownia Fryzjerska</title>
    <style>
      :root {
        --bg: #fff7f2;
        --card: #fffdfb;
        --primary: #1f1a1a;
        --secondary: #b4684f;
        --secondary-strong: #8d4735;
        --text: #2a2525;
        --muted: #6f5f5b;
        --line: #f0dfd8;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #fff7f2 0%, #fffaf8 100%);
        color: var(--text);
      }

      a { text-decoration: none; color: inherit; }
      .container {
        width: min(1100px, calc(100% - 32px));
        margin: 0 auto;
      }

      .topbar {
        background: linear-gradient(90deg, #1f1b1b 0%, #342d2b 100%);
        color: #fff;
        padding: 16px 0;
      }

      .topbar-inner {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .panel {
        padding: 60px 0 90px;
      }

      .panel-card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 30px;
        box-shadow: 0 18px 30px rgba(33, 21, 17, 0.06);
      }

      .login-box {
        max-width: 420px;
        margin: 0 auto;
      }

      h1, h2, h3 {
        margin-top: 0;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      p {
        margin: 0 0 18px;
        color: var(--muted);
      }

      .login-form {
        display: grid;
        gap: 14px;
      }

      .login-form input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        font: inherit;
      }

      .btn {
        display: inline-block;
        background: linear-gradient(135deg, var(--secondary) 0%, var(--secondary-strong) 100%);
        color: #fff;
        border: none;
        border-radius: 999px;
        padding: 14px 22px;
        font-weight: 700;
        cursor: pointer;
      }

      .admin-area {
        display: none;
      }

      .admin-area.visible {
        display: block;
      }

      .admin-grid {
        display: grid;
        gap: 28px;
      }

      .admin-block {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 24px;
      }

      .admin-block h2 {
        margin-bottom: 18px;
      }

      .service-editor-list {
        display: grid;
        gap: 18px;
      }

      .service-editor-card {
        background: #fffaf7;
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px;
      }

      .service-editor-card h3 {
        margin-bottom: 12px;
      }

      .input-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 12px;
      }

      .service-editor-card input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        font: inherit;
      }

      .price-editor-list {
        display: grid;
        gap: 10px;
        margin-top: 10px;
      }

      .price-row {
        display: grid;
        grid-template-columns: 1.3fr 0.7fr;
        gap: 10px;
      }

      .save-pricing-btn {
        margin-top: 18px;
      }

      .review-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 22px;
      }

      .review-table th,
      .review-table td {
        text-align: left;
        vertical-align: top;
        padding: 14px 12px;
        border-bottom: 1px solid var(--line);
      }

      .status-badge {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .status-visible {
        background: rgba(41, 150, 97, 0.12);
        color: #1d6a45;
      }

      .status-blocked {
        background: rgba(183, 77, 61, 0.12);
        color: #7d3027;
      }

      .hours-editor-grid {
        display: grid;
        gap: 12px;
        margin-top: 16px;
      }

      .hours-editor-row {
        display: grid;
        grid-template-columns: 140px 1fr;
        gap: 12px;
        align-items: center;
      }

      .hours-editor-row label {
        font-weight: 700;
        color: var(--text);
      }

      .hours-editor-row input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        font: inherit;
      }

      .holiday-editor {
        display: grid;
        gap: 14px;
        margin-top: 18px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
      }

      .appointment-editor {
        display: grid;
        gap: 16px;
      }

      .appointment-form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .appointment-editor input,
      .appointment-editor select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        font: inherit;
      }

      .appointment-list {
        display: grid;
        gap: 10px;
        margin-top: 6px;
      }

      .appointment-day-box {
        margin-top: 14px;
        background: #fffaf7;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
      }

      .appointment-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        background: #fffaf7;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
      }

      .appointment-item small {
        display: block;
        color: var(--muted);
        margin-top: 4px;
      }

      .appointment-item button {
        background: #b74d3d;
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 8px 12px;
        cursor: pointer;
        font-weight: 700;
      }

      .holiday-toggle {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        color: var(--text);
      }

      .holiday-toggle input {
        width: 18px;
        height: 18px;
      }

      .review-table th {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      .review-table .delete-btn,
      .review-table .toggle-btn {
        border: none;
        border-radius: 10px;
        padding: 8px 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .review-table .delete-btn {
        background: #b74d3d;
        color: #fff;
      }

      .review-table .toggle-btn {
        background: #d9c3a8;
        color: var(--primary);
      }

      .logout-btn {
        background: transparent;
        border: 1px solid rgba(255,255,255,0.25);
        color: #fff;
        border-radius: 999px;
        padding: 9px 18px;
        font-weight: 700;
        cursor: pointer;
      }

      .error {
        display: none;
        background: rgba(183, 77, 61, 0.08);
        color: #7d3027;
        border: 1px solid rgba(183, 77, 61, 0.2);
        border-radius: 12px;
        padding: 10px 12px;
        margin-top: 12px;
        font-weight: 700;
      }

      .error.visible {
        display: block;
      }

      @media (max-width: 680px) {
        .input-grid,
        .price-row {
          grid-template-columns: 1fr;
        }

        .review-table,
        .review-table tbody,
        .review-table tr,
        .review-table td,
        .review-table th {
          display: block;
          width: 100%;
        }

        .review-table thead {
          display: none;
        }

        .review-table tr {
          border: 1px solid var(--line);
          border-radius: 14px;
          margin-bottom: 16px;
          padding: 10px;
          background: #fff;
        }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="container topbar-inner">
        <strong>Panel admin</strong>
        <button class="logout-btn" id="logoutBtn" type="button" style="display:none;">Wyloguj</button>
      </div>
    </div>

    <main class="panel">
      <div class="container">
        <div class="panel-card">
          <div id="loginBox" class="login-box">
            <h1>Logowanie</h1>
            <p>Zaloguj się, aby zarządzać cenami i opiniami klientów.</p>

            <form class="login-form" id="loginForm">
              <input type="text" id="loginUser" placeholder="Login" required />
              <input type="password" id="loginPassword" placeholder="Hasło" required />
              <button type="submit" class="btn">Zaloguj</button>
            </form>

            <div class="error" id="loginError">Niepoprawny login lub hasło.</div>
          </div>

          <div id="adminArea" class="admin-area">
            <div class="admin-grid">
              <section class="admin-block">
                <h2>Cennik usług</h2>
                <div id="serviceEditor"></div>
                <button type="button" class="btn save-pricing-btn" id="savePricingBtn">Zapisz ceny</button>
              </section>

              <section class="admin-block">
                <h2>Godziny otwarcia</h2>
                <div id="hoursEditor" class="hours-editor-grid"></div>
                <button type="button" class="btn save-pricing-btn" id="saveHoursBtn">Zapisz godziny</button>
              </section>

              <section class="admin-block">
                <h2>Wakacje</h2>
                <div class="holiday-editor">
                  <label class="holiday-toggle">
                    <input type="checkbox" id="holidayActive" />
                    <span>Włącz wakacje</span>
                  </label>

                  <div class="input-grid">
                    <input type="date" id="holidayFrom" />
                    <input type="date" id="holidayUntil" />
                  </div>

                  <input type="text" id="holidayMessage" placeholder="Jestem na wakacjach. Wracam do pracy {date}." />
                </div>
                <button type="button" class="btn save-pricing-btn" id="saveHolidayBtn">Zapisz wakacje</button>
              </section>

              <section class="admin-block">
                <h2>Wizyty</h2>
                <div class="appointment-editor">
                  <form id="appointmentForm">
                    <div class="appointment-form-grid">
                      <select id="appointmentService" required></select>
                      <input type="text" id="appointmentHairLength" placeholder="Długość włosów / wariant" value="średnio" required />
                      <input type="date" id="appointmentDate" required />
                      <input type="time" id="appointmentStart" required />
                      <input type="number" id="appointmentDuration" min="30" step="15" value="90" required />
                      <input type="number" id="appointmentCount" min="1" step="1" value="1" required />
                    </div>
                    <button type="submit" class="btn save-pricing-btn" id="appointmentSubmitBtn">Dodaj wizytę</button>
                  </form>
                  <div id="appointmentList" class="appointment-list"></div>
                  <div class="appointment-day-box">
                    <h3>Widok dnia</h3>
                    <div class="appointment-form-grid">
                      <input type="date" id="appointmentDayView" />
                    </div>
                    <div id="appointmentDaySummary" class="appointment-list"></div>
                  </div>
                </div>
              </section>

              <section class="admin-block">
                <h2>Opinie klientów</h2>
                <table class="review-table">
                  <thead>
                    <tr>
                      <th>Autor</th>
                      <th>Opinia</th>
                      <th>Email</th>
                      <th>Status</th>
                      <th>Data</th>
                      <th>Akcja</th>
                    </tr>
                  </thead>
                  <tbody id="adminReviews"></tbody>
                </table>
              </section>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="data-layer.js"></script>
    <script>
      (function () {
        const STORAGE_KEY = 'kurowska_pracownia_opinie';
        const SERVICES_KEY = 'kurowska_pracownia_uslugi';
        const HOURS_KEY = 'kurowska_pracownia_godziny';
        const HOLIDAY_KEY = 'kurowska_pracownia_wakacje';
        const APPOINTMENTS_KEY = 'kurowska_pracownia_wizyty';
        const ADMIN_LOGIN = 'admin';
        const ADMIN_PASSWORD = 'kurowska2025';
        const storage = window.KUROWSKA_STORAGE || {
          getAppointments: () => JSON.parse(localStorage.getItem(APPOINTMENTS_KEY) || '[]'),
          saveAppointments: (value) => localStorage.setItem(APPOINTMENTS_KEY, JSON.stringify(value)),
          getHolidaySettings: () => JSON.parse(localStorage.getItem(HOLIDAY_KEY) || '{"active":false,"from":"","until":"","message":"Jestem na wakacjach. Wracam do pracy {date}."}'),
          saveHolidaySettings: (value) => localStorage.setItem(HOLIDAY_KEY, JSON.stringify(value)),
          getOpeningHours: () => JSON.parse(localStorage.getItem(HOURS_KEY) || '[]'),
          saveOpeningHours: (value) => localStorage.setItem(HOURS_KEY, JSON.stringify(value)),
          getServices: () => JSON.parse(localStorage.getItem(SERVICES_KEY) || '[]'),
          saveServices: (value) => localStorage.setItem(SERVICES_KEY, JSON.stringify(value))
        };

        const defaultHolidaySettings = {
          active: false,
          from: '',
          until: '',
          message: 'Jestem na wakacjach. Wracam do pracy {date}.'
        };

        const defaultOpeningHours = [
          { day: 'Poniedziałek', value: '9:00 - 20:00' },
          { day: 'Wtorek', value: '9:00 - 20:00' },
          { day: 'Środa', value: '9:00 - 20:00' },
          { day: 'Czwartek', value: '9:00 - 20:00' },
          { day: 'Piątek', value: '9:00 - 20:00' },
          { day: 'Sobota', value: 'Brak' },
          { day: 'Niedziela', value: 'Brak' }
        ];

        const defaultServices = [
          {
            slug: 'strzyzenie-meskie',
            name: 'Strzyżenie męskie',
            description: 'Krótkie i klasyczne cięcia',
            startingPrice: 50,
            prices: [
              { label: 'Krótkie', value: 50 },
              { label: 'Średnie', value: 70 },
              { label: 'Długie', value: 90 }
            ]
          },
          {
            slug: 'strzyzenie-damskie',
            name: 'Strzyżenie damskie',
            description: 'Fryzura na miarę, z cięciem i modelowaniem',
            startingPrice: 80,
            prices: [
              { label: 'Do ramion', value: 80 },
              { label: 'Do łopatek', value: 120 },
              { label: 'Długie', value: 170 }
            ]
          },
          {
            slug: 'mycie-wlosow',
            name: 'Mycie włosów',
            description: 'Delikatne oczyszczanie i masaż skóry głowy',
            startingPrice: 30,
            prices: [
              { label: 'Krótko', value: 30 },
              { label: 'Średnio', value: 40 },
              { label: 'Długo', value: 55 }
            ]
          },
          {
            slug: 'modelowanie-wlosow',
            name: 'Modelowanie włosów',
            description: 'Stylizacja na co dzień i na specjalne okazje',
            startingPrice: 70,
            prices: [
              { label: 'Krótko', value: 70 },
              { label: 'Średnio', value: 95 },
              { label: 'Długo', value: 130 }
            ]
          },
          {
            slug: 'koloryzacja',
            name: 'Koloryzacja',
            description: 'Pełna lub częściowa, tonowanie i korekta koloru',
            startingPrice: 180,
            prices: [
              { label: 'Korzenie', value: 180 },
              { label: 'Połowa głowy', value: 230 },
              { label: 'Pełna', value: 320 }
            ]
          },
          {
            slug: 'balayage-ombre',
            name: 'Balayage / ombre',
            description: 'Naturalne przejścia kolorystyczne',
            startingPrice: 260,
            prices: [
              { label: 'Krótko', value: 260 },
              { label: 'Średnio', value: 330 },
              { label: 'Długo', value: 420 }
            ]
          },
          {
            slug: 'regeneracja-wlosow',
            name: 'Regeneracja włosów',
            description: 'Maska, odbudowa i nawilżenie',
            startingPrice: 120,
            prices: [
              { label: 'Krótko', value: 120 },
              { label: 'Średnio', value: 150 },
              { label: 'Długo', value: 190 }
            ]
          },
          {
            slug: 'keratynizacja-prostowanie',
            name: 'Keratynizacja / prostowanie',
            description: 'Gładkie i lśniące włosy na dłużej',
            startingPrice: 250,
            prices: [
              { label: 'Krótko', value: 250 },
              { label: 'Średnio', value: 320 },
              { label: 'Długo', value: 390 }
            ]
          }
        ];

        const loginBox = document.getElementById('loginBox');
        const adminArea = document.getElementById('adminArea');
        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');
        const logoutBtn = document.getElementById('logoutBtn');

        function getServices() {
          try {
            if (window.KUROWSKA_STORAGE && typeof window.KUROWSKA_STORAGE.getServices === 'function') {
              const services = window.KUROWSKA_STORAGE.getServices();
              if (Array.isArray(services) && services.length) return services;
            }

            const raw = localStorage.getItem(SERVICES_KEY);
            if (!raw) {
              localStorage.setItem(SERVICES_KEY, JSON.stringify(defaultServices));
              return [...defaultServices];
            }
            const parsed = JSON.parse(raw);
            return Array.isArray(parsed) && parsed.length ? parsed : [...defaultServices];
          } catch (error) {
            return [...defaultServices];
          }
        }

        function getOpeningHours() {
          try {
            if (window.KUROWSKA_STORAGE && typeof window.KUROWSKA_STORAGE.getOpeningHours === 'function') {
              const hours = window.KUROWSKA_STORAGE.getOpeningHours();
              if (Array.isArray(hours) && hours.length) return hours;
            }

            const raw = localStorage.getItem(HOURS_KEY);
            if (!raw) {
              localStorage.setItem(HOURS_KEY, JSON.stringify(defaultOpeningHours));
              return [...defaultOpeningHours];
            }

            const parsed = JSON.parse(raw);
            if (!Array.isArray(parsed) || !parsed.length) {
              localStorage.setItem(HOURS_KEY, JSON.stringify(defaultOpeningHours));
              return [...defaultOpeningHours];
            }

            return parsed.map((entry) => ({
              day: entry.day || 'Dzień',
              value: entry.value || 'Brak'
            }));
          } catch (error) {
            return [...defaultOpeningHours];
          }
        }

        function getHolidaySettings() {
          try {
            if (window.KUROWSKA_STORAGE && typeof window.KUROWSKA_STORAGE.getHolidaySettings === 'function') {
              const settings = window.KUROWSKA_STORAGE.getHolidaySettings();
              if (settings) return { ...defaultHolidaySettings, ...settings };
            }

            const raw = localStorage.getItem(HOLIDAY_KEY);
            if (!raw) {
              localStorage.setItem(HOLIDAY_KEY, JSON.stringify(defaultHolidaySettings));
              return { ...defaultHolidaySettings };
            }

            const parsed = JSON.parse(raw);
            return {
              active: Boolean(parsed.active),
              from: String(parsed.from || '').trim(),
              until: String(parsed.until || '').trim(),
              message: String(parsed.message || '').trim() || defaultHolidaySettings.message
            };
          } catch (error) {
            return { ...defaultHolidaySettings };
          }
        }

        function getAppointments() {
          try {
            const list = storage.getAppointments && typeof storage.getAppointments === 'function' ? storage.getAppointments() : [];
            return Array.isArray(list) ? list : [];
          } catch (error) {
            return [];
          }
        }

        function saveAppointments(list) {
          if (storage.saveAppointments && typeof storage.saveAppointments === 'function') {
            storage.saveAppointments(list);
            return;
          }
          localStorage.setItem(APPOINTMENTS_KEY, JSON.stringify(list));
        }

        function formatDateForInput(date) {
          if (!date) return '';
          const value = new Date(`${date}T00:00:00`);
          if (Number.isNaN(value.getTime())) return '';
          return value.toISOString().slice(0, 10);
        }

        function renderHoursEditor() {
          const container = document.getElementById('hoursEditor');
          if (!container) return;

          const hours = getOpeningHours();
          container.innerHTML = hours.map((entry) => `
            <div class="hours-editor-row">
              <label for="hours-${entry.day}">${entry.day}</label>
              <input id="hours-${entry.day}" data-day="${entry.day}" value="${(entry.value || '').replace(/"/g, '&quot;')}" />
            </div>
          `).join('');
        }

        function renderHolidayEditor() {
          const activeInput = document.getElementById('holidayActive');
          const fromInput = document.getElementById('holidayFrom');
          const untilInput = document.getElementById('holidayUntil');
          const messageInput = document.getElementById('holidayMessage');
          if (!activeInput || !fromInput || !untilInput || !messageInput) return;

          const settings = getHolidaySettings();
          activeInput.checked = Boolean(settings.active);
          fromInput.value = settings.from || '';
          untilInput.value = settings.until || '';
          messageInput.value = settings.message || defaultHolidaySettings.message;
        }

        async function saveOpeningHours() {
          const inputs = document.querySelectorAll('#hoursEditor input');
          const nextHours = Array.from(inputs).map((input) => ({
            day: input.dataset.day || input.id.replace('hours-', ''),
            value: input.value.trim() || 'Brak'
          }));

          if (window.KUROWSKA_STORAGE && typeof window.KUROWSKA_STORAGE.persistToBackend === 'function') {
            await window.KUROWSKA_STORAGE.persistToBackend(HOURS_KEY, '/api/hours', nextHours, 'POST');
          } else {
            localStorage.setItem(HOURS_KEY, JSON.stringify(nextHours));
          }

          window.dispatchEvent(new Event('kurowska-settings-updated'));
          alert('Zapisano godziny otwarcia.');
        }

        async function saveHolidaySettings() {
          const activeInput = document.getElementById('holidayActive');
          const fromInput = document.getElementById('holidayFrom');
          const untilInput = document.getElementById('holidayUntil');
          const messageInput = document.getElementById('holidayMessage');

          if (!activeInput || !fromInput || !untilInput || !messageInput) return;

          const nextSettings = {
            active: activeInput.checked,
            from: fromInput.value,
            until: untilInput.value,
            message: messageInput.value.trim() || defaultHolidaySettings.message
          };

          if (window.KUROWSKA_STORAGE && typeof window.KUROWSKA_STORAGE.persistToBackend === 'function') {
            await window.KUROWSKA_STORAGE.persistToBackend(HOLIDAY_KEY, '/api/holiday', nextSettings, 'POST');
          } else {
            localStorage.setItem(HOLIDAY_KEY, JSON.stringify(nextSettings));
          }

          window.dispatchEvent(new Event('kurowska-settings-updated'));
          alert('Zapisano ustawienia wakacji.');
        }

        function renderAppointmentOptions() {
          const select = document.getElementById('appointmentService');
          if (!select) return;

          const services = getServices();
          select.innerHTML = services.map((service) => `
            <option value="${service.slug}">${service.name}</option>
          `).join('');

          if (!select.value) {
            select.value = services[0]?.slug || '';
          }
        }

        function renderAppointments() {
          const container = document.getElementById('appointmentList');
          if (!container) return;

          const appointments = getAppointments();
          if (!appointments.length) {
            container.innerHTML = '<div class="appointment-item"><div><strong>Brak zaplanowanych wizyt</strong><small>Dodaj nową wizytę z formularza.</small></div></div>';
            return;
          }

          const services = getServices();
          container.innerHTML = appointments.map((appointment) => {
            const service = services.find((item) => item.slug === appointment.service) || { name: appointment.service || 'Usługa' };
            const label = `${service.name || 'Usługa'} • ${appointment.hairLength || 'Długość włosów'}`;
            const duration = Number(appointment.durationMinutes || 60);
            const endTime = appointment.startTime ? getEndTime(appointment.startTime, duration) : '';
            const id = String(appointment.id || `${appointment.date}-${appointment.startTime}`);
            return `
              <div class="appointment-item">
                <div>
                  <strong>${label}</strong>
                  <small>${appointment.date} • ${appointment.startTime}${endTime ? ` - ${endTime}` : ''} • ${duration} min</small>
                </div>
                <div>
                  <button type="button" data-action="edit" data-id="${id}" style="margin-right:8px;">Edytuj</button>
                  <button type="button" data-action="delete" data-id="${id}">Usuń</button>
                </div>
              </div>
            `;
          }).join('');

          container.querySelectorAll('button[data-action]').forEach((button) => {
            button.addEventListener('click', async () => {
              const id = button.dataset.id;
              if (button.dataset.action === 'delete') {
                const next = getAppointments().filter((appointment) => String(appointment.id || `${appointment.date}-${appointment.startTime}`) !== id);
                if (window.KUROWSKA_STORAGE && typeof window.KUROWSKA_STORAGE.persistToBackend === 'function') {
                  await window.KUROWSKA_STORAGE.persistToBackend(APPOINTMENTS_KEY, '/api/appointments', next, 'POST');
                }
                saveAppointments(next);
                renderAppointments();
                renderDayAvailability();
                return;
              }

              const appointment = getAppointments().find((item) => String(item.id || `${item.date}-${item.startTime}`) === id);
              if (!appointment) return;

              document.getElementById('appointmentService').value = appointment.service || '';
              document.getElementById('appointmentHairLength').value = appointment.hairLength || '';
              document.getElementById('appointmentDate').value = appointment.date || '';
              document.getElementById('appointmentStart').value = appointment.startTime || '';
              document.getElementById('appointmentDuration').value = appointment.durationMinutes || 60;
              document.getElementById('appointmentCount').value = appointment.count || 1;
              document.getElementById('appointmentForm').dataset.editId = id;
              document.getElementById('appointmentSubmitBtn').textContent = 'Zapisz zmiany';
              window.scrollTo({ top: document.getElementById('appointmentForm').offsetTop - 20, behavior: 'smooth' });
            });
          });
        }

        function renderDayAvailability(dateValue) {
          const summary = document.getElementById('appointmentDaySummary');
          if (!summary) return;

          const selectedDate = dateValue || document.getElementById('appointmentDayView')?.value || new Date().toISOString().slice(0, 10);
          const appointments = getAppointments().filter((item) => item.date === selectedDate).sort((a, b) => a.startTime.localeCompare(b.startTime));
          const weekday = new Date(`${selectedDate}T12:00:00`).toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long' });

          if (!appointments.length) {
            summary.innerHTML = `
              <div class="appointment-item">
                <div>
                  <strong>${weekday}</strong>
                  <small>Brak zarezerwowanych wizyt.</small>
                </div>
              </div>
            `;
            return;
          }

          const services = getServices();
          summary.innerHTML = appointments.map((appointment) => {
            const service = services.find((item) => item.slug === appointment.service) || { name: appointment.service || 'Usługa' };
            const endTime = getEndTime(appointment.startTime, Number(appointment.durationMinutes || 60));
            return `
              <div class="appointment-item">
                <div>
                  <strong>${service.name || 'Usługa'} • ${appointment.hairLength || 'Długość włosów'}</strong>
                  <small>${appointment.startTime} - ${endTime} • ${appointment.count || 1} równoległa${Number(appointment.count || 1) > 1 ? 'e' : 'a'} wizyta</small>
                </div>
              </div>
            `;
          }).join('');
        }

        function getEndTime(startTime, durationMinutes) {
          if (!startTime) return '';
          const [hours, minutes] = String(startTime).split(':').map(Number);
          const start = new Date();
          start.setHours(hours || 0, minutes || 0, 0, 0);
          start.setMinutes(start.getMinutes() + Number(durationMinutes || 0));
          return `${String(start.getHours()).padStart(2, '0')}:${String(start.getMinutes()).padStart(2, '0')}`;
        }

        function validateAppointmentForm(form) {
          const input = {
            service: form.service.value.trim(),
            hairLength: form.hairLength.value.trim(),
            date: form.date.value,
            startTime: form.startTime.value,
            durationMinutes: Number(form.duration.value) || 60,
            count: Number(form.count.value) || 1
          };

          if (!input.service || !input.hairLength || !input.date || !input.startTime) {
            alert('Uzupełnij wszystkie pola wizyty.');
            return null;
          }

          if (input.durationMinutes < 30) {
            alert('Czas trwania wizyty musi wynosić co najmniej 30 minut.');
            return null;
          }

          if (input.count < 1) {
            alert('Liczba równoległych wizyt nie może być mniejsza niż 1.');
            return null;
          }

          return input;
        }

        async function handleAppointmentSubmit(event) {
          event.preventDefault();
          const form = document.getElementById('appointmentForm');
          const serviceSelect = document.getElementById('appointmentService');
          const hairInput = document.getElementById('appointmentHairLength');
          const dateInput = document.getElementById('appointmentDate');
          const startInput = document.getElementById('appointmentStart');
          const durationInput = document.getElementById('appointmentDuration');
          const countInput = document.getElementById('appointmentCount');

          const appointment = validateAppointmentForm({
            service: serviceSelect,
            hairLength: hairInput,
            date: dateInput,
            startTime: startInput,
            duration: durationInput,
            count: countInput
          });

          if (!appointment) return;

          const nextAppointments = getAppointments();
          const editId = form.dataset.editId;
          const payload = {
            id: editId || Date.now(),
            service: appointment.service,
            hairLength: appointment.hairLength,
            date: appointment.date,
            startTime: appointment.startTime,
            durationMinutes: appointment.durationMinutes,
            count: appointment.count,
            createdAt: new Date().toISOString()
          };

          if (editId) {
            const index = nextAppointments.findIndex((item) => String(item.id || `${item.date}-${item.startTime}`) === String(editId));
            if (index >= 0) {
              nextAppointments[index] = { ...nextAppointments[index], ...payload };
            }
          } else {
            nextAppointments.push(payload);
          }

          if (window.KUROWSKA_STORAGE && typeof window.KUROWSKA_STORAGE.persistToBackend === 'function') {
            await window.KUROWSKA_STORAGE.persistToBackend(APPOINTMENTS_KEY, '/api/appointments', nextAppointments, 'POST');
          }

          saveAppointments(nextAppointments);
          renderAppointments();
          renderDayAvailability(document.getElementById('appointmentDayView').value || appointment.date);
          form.reset();
          form.removeAttribute('data-edit-id');
          document.getElementById('appointmentSubmitBtn').textContent = 'Dodaj wizytę';
          document.getElementById('appointmentDuration').value = 90;
          document.getElementById('appointmentCount').value = 1;
          const serviceSelector = document.getElementById('appointmentService');
          if (serviceSelector && serviceSelector.options.length) {
            serviceSelector.value = serviceSelector.options[0].value;
          }
          alert(editId ? 'Zapisano zmiany w wizycie.' : 'Dodano wizytę do kalendarza.');
        }

        function isLoggedIn() {
          return sessionStorage.getItem('kurowska_admin_logged') === 'true';
        }

        function renderServiceEditor() {
          const container = document.getElementById('serviceEditor');
          if (!container) return;

          const services = getServices();
          container.innerHTML = services.map((service, index) => {
            const prices = Array.isArray(service.prices) && service.prices.length ? service.prices : [
              { label: 'Cena', value: Number(service.startingPrice) || 0 }
            ];

            return `
              <div class="service-editor-card" data-index="${index}" data-slug="${service.slug}">
                <h3>${index + 1}. ${service.name || 'Usługa'}</h3>
                <div class="input-grid">
                  <input data-field="name" value="${(service.name || '').replace(/"/g, '&quot;')}" placeholder="Nazwa usługi" />
                  <input data-field="startingPrice" type="number" min="0" value="${Number(service.startingPrice) || 0}" placeholder="Cena bazowa" />
                </div>
                <div class="input-grid">
                  <input data-field="description" value="${(service.description || '').replace(/"/g, '&quot;')}" placeholder="Krótki opis" />
                  <input data-field="slug" value="${(service.slug || '').replace(/"/g, '&quot;')}" placeholder="Slug" />
                </div>
                <div class="price-editor-list">
                  ${prices.map((price, priceIndex) => `
                    <div class="price-row">
                      <input data-field="price-label" value="${(price.label || '').replace(/"/g, '&quot;')}" placeholder="Długość / wariant" />
                      <input data-field="price-value" type="number" min="0" value="${Number(price.value) || 0}" placeholder="Cena" />
                    </div>
                  `).join('')}
                </div>
              </div>
            `;
          }).join('');
        }

        async function saveServices() {
          const serviceCards = document.querySelectorAll('.service-editor-card');
          const nextServices = Array.from(serviceCards).map((card) => {
            const name = card.querySelector('[data-field="name"]').value.trim();
            const description = card.querySelector('[data-field="description"]').value.trim();
            const startingPrice = Number(card.querySelector('[data-field="startingPrice"]').value) || 0;
            const slug = (card.querySelector('[data-field="slug"]').value.trim() || name.toLowerCase().replace(/[^a-z0-9]+/g, '-')).replace(/^-|-$/g, '');
            const rows = Array.from(card.querySelectorAll('.price-row'));
            const prices = rows.map((row) => {
              const label = row.querySelector('[data-field="price-label"]').value.trim() || 'Cena';
              const value = Number(row.querySelector('[data-field="price-value"]').value) || 0;
              return { label, value };
            });

            return { slug, name, description, startingPrice, prices };
          });

          if (window.KUROWSKA_STORAGE && typeof window.KUROWSKA_STORAGE.persistToBackend === 'function') {
            await window.KUROWSKA_STORAGE.persistToBackend(SERVICES_KEY, '/api/services', nextServices, 'POST');
          } else {
            localStorage.setItem(SERVICES_KEY, JSON.stringify(nextServices));
          }

          renderServiceEditor();
          alert('Zapisano ceny usług.');
        }

        function renderReviews() {
          const tbody = document.getElementById('adminReviews');
          if (!tbody) return;

          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            const reviews = raw ? JSON.parse(raw) : [];

            if (!Array.isArray(reviews) || !reviews.length) {
              tbody.innerHTML = '<tr><td colspan="5">Brak opinii.</td></tr>';
              return;
            }

            tbody.innerHTML = reviews.map((review) => {
              const author = `${review.name} ${review.surname || review.surnameInitial || ''}`.trim();
              const date = review.createdAt ? new Date(review.createdAt).toLocaleDateString('pl-PL') : '—';
              const isHidden = Boolean(review.hidden || review.status === 'blocked');
              const status = isHidden ? 'Ukryta' : 'Publiczna';
              const statusClass = isHidden ? 'status-blocked' : 'status-visible';
              const toggleLabel = isHidden ? 'Pokaż' : 'Ukryj';

              return `
                <tr>
                  <td>${author}</td>
                  <td>${review.message || ''}</td>
                  <td>${review.email || ''}</td>
                  <td><span class="status-badge ${statusClass}">${status}</span></td>
                  <td>${date}</td>
                  <td>
                    <button class="toggle-btn" data-id="${review.id}" data-hidden="${isHidden ? 'true' : 'false'}">${toggleLabel}</button>
                    <button class="delete-btn" data-id="${review.id}">Usuń</button>
                  </td>
                </tr>
              `;
            }).join('');

            document.querySelectorAll('.toggle-btn').forEach((button) => {
              button.addEventListener('click', function () {
                const id = Number(this.dataset.id);
                const current = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
                const updated = current.map((review) => {
                  if (Number(review.id) !== id) return review;
                  const hidden = this.dataset.hidden === 'true' ? false : true;
                  return {
                    ...review,
                    hidden,
                    status: hidden ? 'blocked' : 'visible'
                  };
                });
                localStorage.setItem(STORAGE_KEY, JSON.stringify(updated));
                renderReviews();
              });
            });

            document.querySelectorAll('.delete-btn').forEach((button) => {
              button.addEventListener('click', function () {
                const id = Number(this.dataset.id);
                const current = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
                const filtered = current.filter((review) => Number(review.id) !== id);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(filtered));
                renderReviews();
              });
            });
          } catch (error) {
            tbody.innerHTML = '<tr><td colspan="5">Błąd odczytu opinii.</td></tr>';
          }
        }

        function login() {
          const user = document.getElementById('loginUser').value.trim();
          const pass = document.getElementById('loginPassword').value.trim();

          if (user === ADMIN_LOGIN && pass === ADMIN_PASSWORD) {
            sessionStorage.setItem('kurowska_admin_logged', 'true');
            loginBox.style.display = 'none';
            adminArea.classList.add('visible');
            logoutBtn.style.display = 'inline-block';
            renderAppointmentOptions();
            renderServiceEditor();
            renderHoursEditor();
            renderHolidayEditor();
            renderAppointments();
            renderReviews();
          } else {
            loginError.classList.add('visible');
          }
        }

        function logout() {
          sessionStorage.removeItem('kurowska_admin_logged');
          loginBox.style.display = 'block';
          adminArea.classList.remove('visible');
          logoutBtn.style.display = 'none';
          loginError.classList.remove('visible');
          loginForm.reset();
        }

        loginForm.addEventListener('submit', function (event) {
          event.preventDefault();
          login();
        });

        logoutBtn.addEventListener('click', logout);
        document.getElementById('savePricingBtn').addEventListener('click', saveServices);
        document.getElementById('saveHoursBtn').addEventListener('click', saveOpeningHours);
        document.getElementById('saveHolidayBtn').addEventListener('click', saveHolidaySettings);
        document.getElementById('appointmentForm').addEventListener('submit', handleAppointmentSubmit);

        const dayViewInput = document.getElementById('appointmentDayView');
        if (dayViewInput) {
          dayViewInput.value = new Date().toISOString().slice(0, 10);
          dayViewInput.addEventListener('change', function () {
            renderDayAvailability(this.value);
          });
        }

        if (document.getElementById('appointmentDate')) {
          document.getElementById('appointmentDate').value = new Date().toISOString().slice(0, 10);
        }

        if (isLoggedIn()) {
          loginBox.style.display = 'none';
          adminArea.classList.add('visible');
          logoutBtn.style.display = 'inline-block';
          renderAppointmentOptions();
          renderServiceEditor();
          renderHoursEditor();
          renderHolidayEditor();
          renderAppointments();
          renderDayAvailability();
          renderReviews();
        }
      })();
    </script>
  </body>
</html>
